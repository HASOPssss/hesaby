<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>حسابي Pro</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: #141414;
      font-family: 'DM Sans', sans-serif;
    }

    .topbar {
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      direction: ltr;
      background: #141414;
      border-bottom: 1px solid #2a2a2a;
      padding: 0 12px;
      -webkit-app-region: drag;
      user-select: none;
    }

    .left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }

    .app-name {
      font-size: 13px;
      font-weight: 500;
      color: #c8c8c8;
      letter-spacing: 0.01em;
    }

    .right {
      display: flex;
      align-items: center;
      gap: 6px;
      -webkit-app-region: no-drag;
    }

    .win-btn {
      width: 32px;
      height: 28px;
      border: 1px solid #3a3a3a;
      background: #222;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      color: #aaa;
    }

    .win-btn:hover { background: #333; border-color: #4a4a4a; color: #fff; }
    .win-btn.close-btn:hover { background: #c0392b; border-color: #c0392b; color: white; }
    .win-btn svg { width: 13px; height: 13px; pointer-events: none; }

    /* Overlay */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 999;
      align-items: center;
      justify-content: center;
      direction: rtl;
    }

    .overlay.show {
      display: flex;
      animation: fadeIn 0.15s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .dialog {
      background: #1c1c1c;
      border: 1px solid #2e2e2e;
      border-radius: 14px;
      padding: 28px 24px 22px;
      width: 280px;
      text-align: center;
      animation: slideUp 0.18s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(10px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    .dialog-icon {
      width: 44px;
      height: 44px;
      background: rgba(192, 57, 43, 0.15);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
    }

    .dialog-icon svg { width: 20px; height: 20px; color: #e74c3c; }

    .dialog h3 {
      font-size: 15px;
      font-weight: 500;
      color: #eee;
      margin-bottom: 8px;
    }

    .dialog p {
      font-size: 12px;
      color: #777;
      margin-bottom: 22px;
      line-height: 1.7;
    }

    .dialog-btns {
      display: flex;
      gap: 8px;
    }

    .btn-cancel {
      flex: 1;
      height: 36px;
      border: 1px solid #333;
      background: #252525;
      border-radius: 8px;
      color: #aaa;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .btn-cancel:hover { background: #2e2e2e; color: #fff; }

    .btn-confirm {
      flex: 1;
      height: 36px;
      border: none;
      background: #c0392b;
      border-radius: 8px;
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-confirm:hover { background: #a93226; }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="left">
      <img class="logo-icon" src="logo.svg" onerror="this.src='logo.png'" alt="logo"/>
      <span class="app-name">حسابي Pro</span>
    </div>
    <div class="right">
      <button class="win-btn" id="btn-minimize" title="تصغير">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </button>
      <button class="win-btn close-btn" id="btn-close" title="إغلاق">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Confirm Exit Dialog -->
  <div class="overlay" id="overlay">
    <div class="dialog">
      <div class="dialog-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </div>
      <h3>إغلاق التطبيق</h3>
      <p>هل أنت متأكد أنك تريد الخروج من حسابي Pro؟</p>
      <div class="dialog-btns">
        <button class="btn-cancel" id="btn-cancel">إلغاء</button>
        <button class="btn-confirm" id="btn-confirm">خروج</button>
      </div>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    const overlay = document.getElementById('overlay');

    document.getElementById('btn-minimize').addEventListener('click', () => {
      ipcRenderer.send('minimize-app');
    });

    document.getElementById('btn-close').addEventListener('click', () => {
      // شيل الـ BrowserView عشان الـ dialog يبان
      ipcRenderer.send('show-dialog');
      overlay.classList.add('show');
    });

    document.getElementById('btn-cancel').addEventListener('click', () => {
      overlay.classList.remove('show');
      // رجّع الـ BrowserView
      ipcRenderer.send('cancel-dialog');
    });

    document.getElementById('btn-confirm').addEventListener('click', () => {
      ipcRenderer.send('close-app');
    });
  </script>
</body>
</html>
